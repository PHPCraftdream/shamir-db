# JSON-form YAML so CI can read the rule document without a YAML dependency.
# Expressions, thresholds, `for`, labels and alert names are unchanged by this
# round; only these comments were updated.
# BACKUP_STALE_THRESHOLD_SECONDS: operator render/substitution knob, not a
# Prometheus variable. Replace the literal 129600 (1.5 x 24h) before loading
# for other schedules; allow for windows and planned gaps.
# BackupStale: shamir_backup_last_success_timestamp_seconds is durable evidence,
# not process memory: the newest of the last successful copy and the schedule's
# FIRST arming time. The success stamp is written to the server_meta store at
# copy success; the first arming time is a separate durable row written once
# when a schedule is first enabled (removed when no schedule is configured).
# The series is seeded at boot from the newest of those rows, so a restart no
# longer zeroes the staleness clock, and BEFORE the first success it reports the
# first arming time rather than zero. The value is clamped to "now" ONCE at
# scrape (a future stamp is replaced by the current time; later scrapes keep
# that clamped value, so the age grows), and a restored data directory carries
# both persisted rows of the backup it came from. The unchanged zero-value
# fallback to shamir_backup_schedule_started_timestamp_seconds stays in the
# expression. An UNREADABLE armed-at row is used for the current boot only and is
# never overwritten (bounded `read-armed-at-failed` token), so the series can report a
# provisional first-arming time without losing the durable one.
# Thresholds and expressions are unchanged; the condition must
# remain true for 5m. A MANUAL successful copy also moves the last-success
# timestamp and therefore clears staleness.
# BackupFailing: the streak increments on scheduled `failed` (including an
# admission refusal) and resets on `completed`, which the scheduler notes at
# protocol completion, BEFORE retention; a long or panicking retention pass
# neither keeps the streak open nor counts as a copy failure.
# BackupRetentionFailing: the counter includes marker-provisioning failures
# (before the copy and at the start of the pass), tag/delete-lease/deletion
# errors and a retention-pass panic; reader-busy skips and the best-effort boot
# marker attempt are not counted.
{
  "groups": [
    {
      "name": "shamir-backup",
      "rules": [
        {
          "alert": "BackupStale",
          "expr": "(time() - ((shamir_backup_last_success_timestamp_seconds > 0) or ((shamir_backup_schedule_started_timestamp_seconds > 0) and (shamir_backup_last_success_timestamp_seconds == 0))) > 129600) and shamir_backup_schedule_enabled == 1",
          "for": "5m",
          "annotations": {
            "summary": "ShamirDB backup is stale or has not yet succeeded since boot"
          }
        },
        {
          "alert": "BackupFailing",
          "expr": "shamir_backup_scheduled_failure_streak >= 3 and ignoring(result) shamir_backup_scheduled_runs_total{result=\"failed\"} >= 3 and shamir_backup_schedule_enabled == 1",
          "annotations": {
            "summary": "At least three consecutive scheduled ShamirDB backups failed"
          }
        },
        {
          "alert": "BackupRetentionFailing",
          "expr": "increase(shamir_backup_retention_failed_total[1h]) > 0",
          "annotations": {
            "summary": "ShamirDB backup retention reported a failure in the last hour"
          }
        }
      ]
    }
  ]
}
