[package]
name = "shamir-index-core"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "ShamirDB index model — descriptors, kinds, meta envelopes, runtime and the IndexBackend trait."
license = "MIT OR Apache-2.0"

[dependencies]
# P34-12 (OQ-2): BLAKE3 posting digest for identity v2 (same version as shamir-funclib).
blake3 = { version = "1.5", features = ["pure"] }
# F-1103 (#1103): concurrency model checker for the `ReaderDrainGate` primitive.
# A regular dependency that ONLY the `loom` feature turns on, so normal builds
# and tests do not compile loom (nor its `generator` helper, which builds
# C/assembly). The `#[cfg(loom)]` module in `reader_drain_gate.rs` is compiled
# away from every other build -- see its doc for the opt-in command.
loom = { version = "0.7", optional = true }
shamir-types       = { path = "../../foundation/shamir-types" }
shamir-collections = { path = "../../foundation/shamir-collections" }
shamir-funclib     = { path = "../../query/shamir-funclib" }
shamir-storage     = { path = "../../storage/shamir-storage", default-features = false }
shamir-tx          = { path = "../../storage/shamir-tx" }
shamir-tunables    = { path = "../../foundation/shamir-tunables" }

# Async / runtime
tokio       = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.81"
bytes       = "1.11.0"
futures     = "0.3"

# Data
serde      = { version = "1.0.217", features = ["derive"] }
bincode    = "1.3.3"
rmp-serde  = "1.3"
smallvec   = { version = "1.11", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"

# Concurrency
scc      = "3.8"
arc-swap = "1.7"

[dev-dependencies]
shamir-storage = { path = "../../storage/shamir-storage" }
rust_decimal = { version = "1.40.0", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }

[lib]
doctest = false

[features]
# F-1103 (#1103): enables the loom model-checker module in
# `model/runtime/reader_drain_gate.rs`. The `build.rs` emits `cfg(loom)` ONLY for
# this crate when this feature is on (NOT via a global rustflag), so the heavy
# dependency tree stays out of its own loom code paths. Run with:
#   cargo test -p shamir-index-core --features loom --lib \
#       reader_drain_gate::loom_model
loom = ["dep:loom"]

[lints]
workspace = true
