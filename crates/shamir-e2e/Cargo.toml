[package]
name = "shamir-e2e"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "Test-only crate: end-to-end tests that boot a real server against shamir-client."
license = "MIT OR Apache-2.0"

# Everything is dev-only: src/lib.rs is a doc comment, so every dependency
# lives in [dev-dependencies] and compiles only for the test targets.

[dev-dependencies]
shamir-client        = { path = "../shamir-client" }
shamir-connect       = { path = "../shamir-connect" }
shamir-db            = { path = "../shamir-db" }
shamir-query-builder = { path = "../shamir-query-builder" }
shamir-query-types   = { path = "../shamir-query-types" }
shamir-server        = { path = "../shamir-server" }
shamir-types         = { path = "../shamir-types" }
# Failure-only flake diagnostics (design: docs/dev-artifacts/design/flake-failure-logs.md)
# — dev-only crate; the `tracing` feature enables the tracing ring layer.
shamir-test-diag = { path = "../shamir-test-diag", features = ["tracing"] }

futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "time"] }
zeroize = "1.8"

[lib]
# Doctests are banned project-wide (slow: recompile-per-example).
doctest = false

[lints]
workspace = true
