[package]
name = "shamir-sync"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"

[lib]
doctest = false

[dependencies]
shamir-server-security = { path = "../shamir-server-security" }
shamir-connect = { path = "../../net/shamir-connect", features = ["server", "client", "durable-fjall"] }
shamir-tunables = { path = "../../foundation/shamir-tunables" }
shamir-collections = { path = "../../foundation/shamir-collections" }
shamir-db = { path = "../../engine/shamir-db" }
shamir-query-types = { path = "../../query/shamir-query-types" }
shamir-tx = { path = "../../storage/shamir-tx" }
shamir-types = { path = "../../foundation/shamir-types", default-features = false }
shamir-client = { path = "../../client/shamir-client" }
shamir-transport-tcp = { path = "../../net/shamir-transport-tcp" }
shamir-transport-ws = { path = "../../net/shamir-transport-ws" }
shamir-transport-http = { path = "../../net/shamir-transport-http" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tokio-tungstenite = "0.30"
fjall = "3.0.1"
fs4 = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bytes = "1.11.0"
rmp-serde = "1.3"
base64 = "0.22"
hex = "0.4"
sha2 = "0.11"
serde_json = "1.0"
zeroize = "1.7"
thiserror = "2.0"
async-trait = "0.1.81"
anyhow = "1.0"
tracing = "0.1"
metrics = "0.24"
parking_lot = "0.13"
dashmap = "6.1"
scc = "3.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
shamir-query-builder = { path = "../../query/shamir-query-builder" }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
ktav = "0.8"
shamir-db = { path = "../../engine/shamir-db", features = ["test-util"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
