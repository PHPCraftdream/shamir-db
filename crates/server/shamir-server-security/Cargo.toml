[package]
name = "shamir-server-security"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"

[lib]
doctest = false

[dependencies]
shamir-connect = { path = "../../net/shamir-connect", features = ["server", "client", "durable-fjall"] }
shamir-tunables = { path = "../../foundation/shamir-tunables" }
shamir-collections = { path = "../../foundation/shamir-collections" }
shamir-db = { path = "../../engine/shamir-db" }
shamir-query-types = { path = "../../query/shamir-query-types" }
shamir-types = { path = "../../foundation/shamir-types", default-features = false }
shamir-tx = { path = "../../storage/shamir-tx" }
shamir-transport-http = { path = "../../net/shamir-transport-http" }
shamir-transport-tcp = { path = "../../net/shamir-transport-tcp" }
shamir-transport-ws = { path = "../../net/shamir-transport-ws" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
futures-util = "0.3"
tokio-util = "0.7"
tokio-tungstenite = "0.30"
fjall = "3.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
base64 = "0.22"
hex = "0.4"
serde_json = "1.0"
bytes = "1.11.0"
dashmap = "6.1"
zeroize = "1.7"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
arc-swap = "1.7"
once_cell = "1.20"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.13"
scc = "3.8"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2"
captrack = { workspace = true }

[dev-dependencies]
shamir-query-builder = { path = "../../query/shamir-query-builder" }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
serial_test = "3"

[lints]
workspace = true
