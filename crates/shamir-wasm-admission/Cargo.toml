[package]
name = "shamir-wasm-admission"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Structural admission scan (parse, feature set, imports, sections). Pinned
# to the exact version wasmtime 48 pulls transitively (see `Cargo.lock`) so
# no second copy enters the dependency graph.
wasmparser = "=0.254.2"
# XXH3-128 module identity/corruption hash (`ModuleHash`); not for security decisions.
xxhash-rust = { version = "0.8.15", default-features = false, features = ["xxh3"] }
thiserror = "2.0"

[dev-dependencies]
# WAT-text -> binary conversion for the test fixtures.
wat = "=1.254.2"

[lib]
doctest = false

[lints]
workspace = true
