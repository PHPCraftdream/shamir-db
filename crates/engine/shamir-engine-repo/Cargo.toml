[package]
name = "shamir-engine-repo"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "ShamirDB repo layer (journal / meta / seed primitives), re-exported as shamir_engine::repo::*."
license = "MIT OR Apache-2.0"

[dependencies]
shamir-types = { path = "../../foundation/shamir-types" }
shamir-collections = { path = "../../foundation/shamir-collections" }
shamir-metrics = { path = "../../foundation/shamir-metrics" }
shamir-storage = { path = "../../storage/shamir-storage", default-features = false }
shamir-wal = { path = "../../storage/shamir-wal" }
shamir-tx = { path = "../../storage/shamir-tx" }
shamir-index = { path = "../../index/shamir-index" }
shamir-query-types = { path = "../../query/shamir-query-types" }
shamir-tunables = { path = "../../foundation/shamir-tunables" }

tokio = { version = "1.49.0", features = ["full"] }
bytes = "1.11.0"
futures = "0.3"
serde = { version = "1.0.217", features = ["derive"] }
rustc-hash = "2.1"
rand = "0.9.2"
dashmap = "6.1.0"
scc = "3.8"
async-trait = "0.1.81"
arc-swap = "1.7"
bincode = "1.3.3"
log = "0.4"
rmp-serde = "1.3.0"
thiserror = "2.0"

[features]
# Cascade `shamir-storage`'s fjall backend feature upward so the engine
# facade can forward it here (`BoxRepo` / `BoxRepoFactory` variants in
# `repo_types` are gated by it).
fjall = ["shamir-storage/fjall"]
# Exposes test-only seams (`RecoverabilityCoverage`, replication-bound
# test knobs) to the engine facade's own tests. Never enabled by default.
test-util = []

[dev-dependencies]
tempfile = "3.10.1"
tokio = { version = "1.49.0", features = ["test-util"] }

[lib]
doctest = false

[lints]
workspace = true
