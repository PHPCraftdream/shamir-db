[package]
name = "shamir-connect"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "ShamirDB connection protocol — SCRAM-Argon2id auth + Ed25519 server identity. Server and client modules in one library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PHPCraftdream/shamir-db"

[lib]
name = "shamir_connect"
path = "src/lib.rs"
# Doctests are banned project-wide (slow: recompile-per-example).
doctest = false

[features]
default = ["client", "server"]
client = []
server = ["dashmap", "parking_lot", "rustc-hash", "arc-swap"]
durable-fjall = ["server", "fjall"]

[dependencies]
# Crypto primitives (per spec §18)
argon2 = "0.5"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
aes-gcm = "0.10"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.9"

# Encoding
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

# Username normalization (RFC 8265 PRECIS UsernameCaseMapped)
unicode-normalization = "0.1"
precis-profiles = "0.1"

# Errors
thiserror = "2.0"

# Logging for background GC / persistence failures that should not
# kill the request path but must surface to operators.
log = "0.4"

# Post-auth per-session rate-limit tunable (task #608).
shamir-tunables = { path = "../shamir-tunables" }

# Server-only (concurrent state)
arc-swap = { version = "1.7", optional = true }
dashmap = { version = "6.1", optional = true }
parking_lot = { version = "0.12", optional = true }
# SmallVec for the per-user session slot in `SessionStore::by_user`
# (stack-allocated at the spec §7.4 cap of 16; RV-CONNECT-D8C2825A).
smallvec = "1.11"
# Fast non-cryptographic hasher for the DashMaps that key by fixed-size
# byte arrays (session_id [u8;32], Subnet [u8;3..8]). DashMap's default
# SipHash is overkill for hash-tables where DoS resistance is already
# enforced upstream (rate limiter, auth). fxhash is unmaintained
# (RUSTSEC-2025-0057); rustc-hash is the actively maintained continuation.
rustc-hash = { version = "2.1", optional = true }
# Durable counter store (optional: durable-fjall feature)
fjall = { version = "3.0.1", optional = true }

[dev-dependencies]
hex = "0.4"
toml = "0.8"
bench-scale-tool = { workspace = true, features = ["async"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true

# Integration tests live in topical subfolders, so autodiscovery (which only
# scans tests/*.rs at the top level) is replaced by explicit targets.
[[test]]
name = "integration_admin"
path = "tests/admin/integration_admin.rs"

[[test]]
name = "integration_bootstrap"
path = "tests/lifecycle/integration_bootstrap.rs"

[[test]]
name = "integration_changepw"
path = "tests/lifecycle/integration_changepw.rs"

[[test]]
name = "integration_full_auth"
path = "tests/auth/integration_full_auth.rs"

[[test]]
name = "rv_handshake_0fc58d93_tofu_pin"
path = "tests/auth/rv_handshake_0fc58d93_tofu_pin_after_identity_verify.rs"

[[test]]
name = "integration_log_redaction"
path = "tests/audit/integration_log_redaction.rs"

[[test]]
name = "integration_resume"
path = "tests/resume/main.rs"

[[test]]
name = "integration_rotation"
path = "tests/lifecycle/integration_rotation.rs"

[[test]]
name = "integration_session"
path = "tests/session/integration_session.rs"

[[test]]
name = "integration_username_precis"
path = "tests/identity/integration_username_precis.rs"
[[test]]
name = "rv_feature_fed6910e_client_only"
path = "tests/lifecycle/rv_feature_fed6910e_client_only_surface.rs"

