[package]
name = "shamir-wasm-host"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
shamir-types = { path = "../../foundation/shamir-types" }
shamir-collections = { path = "../../foundation/shamir-collections" }
shamir-funclib = { path = "../../query/shamir-funclib" }
shamir-lang = { path = "../shamir-lang" }
shamir-proc-tree = { path = "../../foundation/shamir-proc-tree" }
shamir-wasm-admission = { path = "../shamir-wasm-admission" }
# Lock-free RCU slot holding a function's live compiled form (two-tier swap).
arc-swap = "1.7"
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.81"
thiserror = "2.0"
log = "0.4"
wasmtime = { version = "48", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "wat",
    "async",
    "pooling-allocator",
    "incremental-cache",
    "winch",
] }
sha2 = "0.11"
tempfile = "3.10.1"
scc = "3.8"
# Used by `compile_rust_source` to enforce a wall-clock timeout on the
# guest `cargo build` (CRIT-6 / audit #440 part A). Already a transitive dep
# in the workspace `Cargo.lock`; pinned here as a direct dependency.
wait-timeout = "0.2.1"
# WAT-text -> binary conversion for `WasmFunction::from_wat`.
wat = "=1.254.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "process"] }

# Windows disk tier (DEC-3 Q5-c): private-directory create/verify for
# `<data_dir>/cache/wasm`, built on the shared crate's safe API.
[target.'cfg(windows)'.dependencies]
shamir-private-dir = { path = "../../foundation/shamir-private-dir" }

[dev-dependencies]
argon2 = "0.5"
bench-scale-tool = { workspace = true, features = ["async"] }
# DEV-ONLY: `test-util` enables paused time (`start_paused`/`advance()`)
# for the deterministic wall-clock-deadline regression. Same tokio
# package+version as the main dependency — features unify, `Cargo.lock`
# is unchanged.
tokio = { version = "1.49.0", features = ["test-util"] }
# TEST-ONLY: M1 runtime execution tests build the guest runtime module and
# its codec vectors through `shamir-lang::testsupport` (hidden test API);
# the dev-dependency enables shamir-lang's `testsupport` feature.
shamir-lang = { path = "../shamir-lang", features = ["testsupport"] }

# Bench/A-B only: the Winch and Pulley backends plus env-selected engine strategy
# (`SHAMIR_WASM_STRATEGY`). Off by default and never enabled by the server build.
[features]
bench-strategies = ["wasmtime/winch", "wasmtime/pulley"]

[[bench]]
name = "wasm_procedures"
path = "benches/wasm_procedures/main.rs"
harness = false

[[bench]]
name = "wasm_scale"
path = "benches/wasm_scale/main.rs"
harness = false

[lib]
doctest = false

[lints]
workspace = true
