[package]
name = "shamir-transport-ipc"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "ShamirDB local-IPC transport binding — Unix domain sockets (POSIX) / Windows Named Pipes behind one platform-agnostic API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PHPCraftdream/shamir-db"

[dependencies]
# Async runtime — `net` covers both `tokio::net::UnixListener` (unix) and
# `tokio::net::windows::named_pipe` (windows); `full` matches the convention
# already used by `shamir-transport-tcp`.
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
# Shared owner-only security-descriptor primitive (DEC-3 Q5-c): the
# `unsafe` Win32 SDDL/SID code lives in `shamir-private-dir`; this crate
# keeps only the single `unsafe` pipe-create call.
shamir-private-dir = { path = "../shamir-private-dir" }

[dev-dependencies]
tempfile = "3"

# Test-only pipe DACL inspection (tests/windows_dacl.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lib]
# Doctests are banned project-wide (slow: recompile-per-example). Examples
# live as illustration; behavioural coverage is in unit/integration tests.
doctest = false

[lints]
workspace = true
