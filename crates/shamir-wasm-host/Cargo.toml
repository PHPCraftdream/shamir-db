[package]
name = "shamir-wasm-host"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
shamir-types = { path = "../shamir-types" }
shamir-collections = { path = "../shamir-collections" }
shamir-funclib = { path = "../shamir-funclib" }
shamir-proc-tree = { path = "../shamir-proc-tree" }
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.81"
serde = { version = "1.0.217", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
wasmtime = { version = "48", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "wat",
    "async",
    "pooling-allocator",
    "incremental-cache",
] }
sha2 = "0.10.9"
tempfile = "3.10.1"
scc = "3.8"
# Used by `compile_rust_source` to enforce a wall-clock timeout on the
# guest `cargo build` (CRIT-6 / audit #440 part A). Already a transitive dep
# in the workspace `Cargo.lock`; pinned here as a direct dependency.
wait-timeout = "0.2.1"
# Structural pre-instantiation sanitizer (task #545). Pinned to the exact
# version wasmtime 48 pulls transitively (see `Cargo.lock`) so no second
# copy enters the dependency graph.
wasmparser = "=0.254.2"
# WAT-text -> binary conversion for `WasmFunction::from_wat`.
wat = "=1.254.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "process"] }

# Windows disk tier (DEC-3 Q5-c): private-directory create/verify for
# `<data_dir>/cache/wasm`, built on the shared crate's safe API.
[target.'cfg(windows)'.dependencies]
shamir-private-dir = { path = "../shamir-private-dir" }

[dev-dependencies]
argon2 = "0.5"
# DEV-ONLY: `test-util` enables paused time (`start_paused`/`advance()`)
# for the deterministic wall-clock-deadline regression. Same tokio
# package+version as the main dependency — features unify, `Cargo.lock`
# is unchanged.
tokio = { version = "1.49.0", features = ["test-util"] }

[lib]
doctest = false

[lints]
workspace = true
