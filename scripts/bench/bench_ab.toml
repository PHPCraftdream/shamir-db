crate = "shamir-engine"
bench = "read_path_matrix"
class = "async"
cells = ["fast_path/1000", "fast_path/3000", "s2_no_index/1000", "s2_no_index/3000", "s3_range_and/1000", "s3_range_and/3000"]
[[benches]]
rank = 4
crate = "shamir-db"
bench = "changelog_read"
class = "async"
cells = ["changelog_read_from/from_depth_100_lim_100"]
[[benches]]
rank = 5
crate = "shamir-server"
bench = "subscription_throughput"
