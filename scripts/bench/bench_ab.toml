reason = "Standalone fixture lacks the required repo gate; needs frozen compatibility adapters."
[[unsupported]]
cell = "transactional snapshot/serializable and exact vector ranking"
reason = "No reviewed cross-revision fixture/counts; adapter vector_search is not end-to-end coverage."
[[unsupported]]
cell = "subscription_delivery rejecting-sink"
reason = "Accepting sinks do not exercise retry/backpressure; future fixture needs reviewed cross-revision adapters."
[[unsupported]]
