# Production sources that sit under a tests/ path (treated as production, not reported by --check).
production_in_test_path = ["crates/engine/shamir-db/src/shamir_db/shamir_db/seed/tests/durability_init.rs"]
canary = ["shamir-types", "shamir-query-types", "shamir-server", "shamir-sdk", "shamir-client"]

[[edge]]
paths = ["crates/wasm/shamir-sdk/**"]
crates = ["shamir-wasm-host"]
propagate = "prod"
reason = "wasm-host's guest build workspace consumes SDK sources by path"

[[edge]]
paths = ["crates/wasm/shamir-sdk-macros/**"]
crates = ["shamir-wasm-host"]
propagate = "prod"
reason = "wasm-host's guest build workspace includes the sibling SDK macro crate by path"

[[edge]]
paths = ["crates/query/shamir-query-builder/tests/fixtures/wire_ops_matrix.json"]
crates = []
propagate = "tests"
flags = ["ts"]
reason = "TypeScript wire-op parity tests read this shared fixture"

[[edge]]
paths = ["crates/query/shamir-query-builder/tests/fixtures/create_index_matrix.json", "crates/query/shamir-query-builder/tests/fixtures/vector_filter_msgpack.json", "crates/query/shamir-query-builder/tests/fixtures/repl_ddl_msgpack.json", "crates/query/shamir-query-builder/tests/fixtures/schema_migration_canonical_vectors.json"]
crates = []
propagate = "tests"
flags = ["ts"]
reason = "four TypeScript parity suites consume shared Rust builder byte fixtures"

[[edge]]
paths = ["crates/query/shamir-query-types/test-vectors/**"]
crates = []
propagate = "tests"
flags = ["ts"]
reason = "TypeScript protocol tests read query-types vector files"

[[edge]]
paths = ["crates/query/shamir-query-types/test-vectors/username_precis.json"]
crates = ["shamir-connect"]
propagate = "tests"
reason = "Rust username integration tests consume the shared PRECIS vector"

[[edge]]
paths = ["crates/net/shamir-connect/test-vectors", "crates/net/shamir-connect/test-vectors/**"]
crates = []
propagate = "tests"
flags = ["ts"]
reason = "TypeScript login tests read shared shamir-connect vectors"

[[edge]]
paths = ["deploy/**"]
crates = ["shamir-server"]
propagate = "tests"
reason = "shamir-server config tests include shipped deployment profiles"

[[edge]]
paths = ["crates/engine/shamir-db/src/shamir_db/gateway/curl_gateway.rs"]
crates = ["shamir-wasm-host"]
propagate = "tests"
reason = "wasm-host's gateway unit test includes this exact shamir-db source target"

[[edge]]
paths = ["crates/engine/shamir-db/src/shamir_db/system_store/catalogue/schema_migrations/**", "crates/engine/shamir-db/src/shamir_db/execute/admin_db/schema_migration/**"]
crates = []
propagate = "tests"
flags = ["node", "ts"]
reason = "typed schema-migration producer: Node binding and TS client compatibility suites exercise these engine paths"

[[edge]]
paths = ["crates/client/shamir-client-ts/src/core/builders/admin/schema-migration/**"]
crates = []
propagate = "tests"
flags = ["node"]
reason = "Node binding tests consume the TS schema-migration builder"

[[edge]]
paths = ["crates/client/shamir-client/src/client/session/mux/export.rs", "crates/server/shamir-server/src/boot/config/diagnostics/logical/export_online/**", "crates/server/shamir-server/src/boot/config/diagnostics/logical/logical_dump/driver.rs", "crates/server/shamir-server/src/boot/config/diagnostics/logical/logical_dump/projection.rs", "crates/server/shamir-server/src/engine/db_handler/repo_admin/export_gate.rs"]
crates = ["shamir-db"]
propagate = "tests"
reason = "shamir-db owns the export artifact codec/verifier these paths produce and consume, but Cargo never selects db there (db is a normal dependency of the server, not a dependent, and no dependency of the client; the e2e suite itself is selected only as a dev-dependent of server/client): the online export job (StartExport/ExportStatus/CancelExport over export_online, gated by export_gate), the offline logical_dump driver/projection and the client mux export reader are all round-tripped through db's export/verify/import contract, so db's own suite runs alongside"

[[edge]]
paths = ["Cargo.lock"]
crates = ["shamir-storage"]
propagate = "tests"
reason = "shamir-storage unit test reads the root Cargo.lock directly"
