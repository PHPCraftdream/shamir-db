name: 'Build nextest test archive'
description: >
  Shared build steps for the archive consumed only by the lib `test` job;
  `integration` builds in place. Uses rust-cache and sccache, then
  ./scripts/test.sh --archive-to. Optionally uploads the archive artifact.
  `packages` takes validated `-p <crate>` pairs from CI; the default
  `--workspace` remains for `cache-warm.yml` compatibility. Empty selection
  skips building and upload.

inputs:
  shared-key:
    description: 'rust-cache shared key; must match between test-build and cache-warm'
    required: false
    default: 'test-archive-v1'
  upload:
    description: "'true' to upload the archive as a workflow artifact"
    required: false
    default: 'false'
  artifact-name:
    description: 'artifact name when upload is true'
    required: false
    default: 'test-archive'
  packages:
    description: 'validated explicit package selection passed to ./scripts/test.sh --archive-to; "--workspace" is retained for cache-warm compatibility'
    required: false
    default: '--workspace'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
    - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
      with:
        tool: nextest@0.9.137
    - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      with:
        shared-key: ${{ inputs.shared-key }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
    - name: enable sccache
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - name: build test archive (timed)
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ARCHIVE_PATH: ${{ runner.temp }}/test-archive.tar.zst
      run: |
        set -euo pipefail
        python3 -I - <<'PY'
        import json
        import os
        import re
        import subprocess
        import sys
        import time

        packages = os.environ["PACKAGES"].split()
        if not packages:
            print("::notice::empty package selection: test archive build skipped")
            raise SystemExit(0)
        if packages == ["--workspace"]:
            selection = ["--workspace"]
        else:
            if len(packages) % 2 or any(packages[index] != "-p" for index in range(0, len(packages), 2)):
                raise SystemExit("invalid package selection")
            names = packages[1::2]
            if any(not re.fullmatch(r"[A-Za-z0-9_-]+", name) for name in names):
                raise SystemExit("invalid package name")
            metadata = json.loads(subprocess.check_output([
                "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"
            ], text=True))
            members = set(metadata["workspace_members"])
            available = {package["name"] for package in metadata["packages"] if package["id"] in members}
            if len(set(names)) != len(names) or not set(names) <= available:
                raise SystemExit("package selection is not a unique workspace package list")
            selection = [token for name in names for token in ("-p", name)]
        start = time.time()
        result = subprocess.run([
            "bash", "./scripts/test.sh", "--archive-to", os.environ["ARCHIVE_PATH"], "--locked", *selection
        ])
        if result.returncode:
            raise SystemExit(result.returncode)
        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary:
            with open(summary, "a", encoding="utf-8") as stream:
                stream.write("test archive built in %d s\n" % int(time.time() - start))
        PY
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: inputs.upload == 'true' && inputs.packages != ''
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/test-archive.tar.zst
        if-no-files-found: error
        retention-days: 1
