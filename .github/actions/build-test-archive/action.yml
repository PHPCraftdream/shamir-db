name: 'Build nextest test archive'
description: >
  Shared build steps for the archive consumed only by the lib `test` job;
  `integration` builds in place. Uses rust-cache and sccache, then
  ./scripts/test.sh --archive-to. Optionally uploads the archive artifact.

inputs:
  shared-key:
    description: 'rust-cache shared key; must match between test-build and cache-warm'
    required: false
    default: 'test-archive-v1'
  upload:
    description: "'true' to upload the archive as a workflow artifact"
    required: false
    default: 'false'
  artifact-name:
    description: 'artifact name when upload is true'
    required: false
    default: 'test-archive'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
      with:
        tool: nextest@0.9.137
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      with:
        shared-key: ${{ inputs.shared-key }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
    - name: enable sccache
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - name: build test archive (timed)
      shell: bash
      run: |
        set -euo pipefail
        start=$(date +%s)
        ./scripts/test.sh --archive-to "$RUNNER_TEMP/test-archive.tar.zst" --locked
        end=$(date +%s)
        echo "test archive built in $((end - start))s" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: inputs.upload == 'true'
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/test-archive.tar.zst
        if-no-files-found: error
        retention-days: 1
