name: 'Build nextest test archive'
description: >
  Shared build steps for the archive consumed only by the lib `test` job;
  `integration` builds in place. Uses rust-cache and sccache, then
  ./scripts/test.sh --archive-to. Optionally uploads the archive artifact.
  `packages` narrows the build (default `--workspace`; empty skips the build and the upload).

inputs:
  shared-key:
    description: 'rust-cache shared key; must match between test-build and cache-warm'
    required: false
    default: 'test-archive-v1'
  upload:
    description: "'true' to upload the archive as a workflow artifact"
    required: false
    default: 'false'
  artifact-name:
    description: 'artifact name when upload is true'
    required: false
    default: 'test-archive'
  packages:
    description: 'package selection passed to ./scripts/test.sh --archive-to; "--workspace", "-p a -p b", or empty to skip the build+upload'
    required: false
    default: '--workspace'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
    - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
      with:
        tool: nextest@0.9.137
    - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      with:
        shared-key: ${{ inputs.shared-key }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
    - name: enable sccache
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - name: build test archive (timed)
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        if [ -z "$PACKAGES" ]; then
          echo "::notice::empty package selection (docs-only diff): test archive build skipped"
          exit 0
        fi
        start=$(date +%s)
        ./scripts/test.sh --archive-to "$RUNNER_TEMP/test-archive.tar.zst" --locked $PACKAGES
        end=$(date +%s)
        echo "test archive built in $((end - start))s" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      if: inputs.upload == 'true' && inputs.packages != ''
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/test-archive.tar.zst
        if-no-files-found: error
        retention-days: 1
