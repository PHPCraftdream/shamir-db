name: npm-licenses

# License gate for the committed npm lockfiles (the Rust graph is gated by
# `cargo deny check` in supply-chain.yml, which uses the same permissive
# allow-list).
#
# Runs ONLY when the npm dependency set can have changed: a push to master or a
# PR that touches a package.json, a package-lock.json, the gate script or this
# workflow. A filtered event does not start the workflow at all (intended), so a
# push without dependency changes since the previous run costs nothing.
#
# The gate (scripts/ci/gates/npm_licenses_check.py, unit tests in
# scripts/ci/tests/gates/) reads the lockfiles only: no `npm install`, no
# network, a few seconds. It also runs on draft PRs because it is that cheap.

on:
  push:
    branches: [master]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - 'scripts/ci/gates/npm_licenses_check.py'
      - '.github/workflows/npm-licenses.yml'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - 'scripts/ci/gates/npm_licenses_check.py'
      - '.github/workflows/npm-licenses.yml'
  workflow_dispatch: {}

# A newer push to the same PR cancels the older (superseded) run; master pushes
# and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default: the job only reads the repo.
permissions:
  contents: read

jobs:
  npm-licenses:
    name: npm license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: npm license gate
        run: python3 -I scripts/ci/gates/npm_licenses_check.py
