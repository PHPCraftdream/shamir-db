name: HNSW recall matrix (#1070)

# Manual-dispatch-only diagnostic workflow — measures the REAL cross-platform
# recall@10 distribution for the two statistical HNSW quality tests
# (`restart_preserves_recall_at_10_against_brute_force`, 3k vectors, and
# `recall_at_10_on_1k_vectors`, 1k vectors) across Linux/macOS/Windows.
#
# Why this exists: `hnsw_rs` 0.3.4 seeds its layer-assignment RNG from OS
# entropy with no public seed hook, so graph construction quality varies by
# platform in a way that has never been directly measured — only inferred
# from isolated single-run CI failures (F-68, F-1034). This workflow runs
# each test N times per OS and prints one `recall_at_10=<value>` line per
# run so a human can collect min/max/mean per platform and set doc claims /
# test floors from real data instead of another isolated observation.
#
# NOT part of the push/PR gate — `on: workflow_dispatch` only. Each run
# costs real CI minutes on this public repo (3 OS x N x ~2 tests), so this
# is dispatched deliberately, not on every commit.

on:
  workflow_dispatch:
    inputs:
      runs_per_os:
        description: "How many times to run each recall test, per OS"
        required: false
        default: "20"
      load_runs:
        description: "If > 0: skip the recall loops; on ubuntu run the full lib suite this many times under nextest parallelism (#1232 load repro)"
        required: false
        default: "0"
      probe_runs:
        description: "If > 0: skip the recall loops; on ubuntu run the SQ8 quantized_graph tests this many times under CPU oversubscription and dump gdb stacks of any process stuck > 90s (#1232 hang probe)"
        required: false
        default: "0"
      int_runs:
        description: "If > 0: skip the recall loops; on ubuntu run the integration/e2e test binaries (kind(test)) this many times and print every failing test with its panic message (flake census)"
        required: false
        default: "0"
      int_filter:
        description: "nextest filterset for int_runs (default kind(test))"
        required: false
        default: "kind(test)"
      int_burners:
        description: "busy-loop processes started next to int_runs to oversubscribe the CPU"
        required: false
        default: "0"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  recall-matrix:
    name: recall matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      # Same pin as ci.yml's `test` job — see that job's comment for why the
      # version is pinned (the `.cargo/config.toml` perimeter guard gates on
      # the $NEXTEST env var this exact binary sets).
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # #1232: `recall_sq8_vs_f32_within_two_percent` (SQ8 u8 graph vs f32
      # graph) read 0.844 once on a CI ubuntu runner (floor 0.95, usual
      # 0.97). Runtime SIMD dispatch (avx512f / avx2 / scalar) makes the CPU
      # model a suspect, so print it next to the per-run recall values.
      - name: Runner CPU
        shell: bash
        run: |
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 -o 'avx512f' /proc/cpuinfo || echo "no avx512f"
            grep -m1 -o 'avx2' /proc/cpuinfo || echo "no avx2"
          else
            sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "$PROCESSOR_IDENTIFIER"
          fi
      - name: Run recall_sq8_vs_f32_within_two_percent x N
        if: ${{ (github.event.inputs.load_runs || '0') == '0' && (github.event.inputs.probe_runs || '0') == '0' && (github.event.inputs.int_runs || '0') == '0' }}
        shell: bash
        run: |
          set -uo pipefail
          N="${{ github.event.inputs.runs_per_os || '20' }}"
          for i in $(seq 1 "$N"); do
            echo "--- run $i/$N ---"
            NEXTEST=1 cargo nextest run --locked -p shamir-index --lib \
              -E 'test(recall_sq8_vs_f32_within_two_percent)' \
              --success-output=immediate --no-fail-fast || true
          done
      # Build once — every repeated run below reuses the same test binary.
      # `--success-output=immediate` forces the `println!("#1070
      # recall_at_10=...")` line to appear in the log on a PASSING run too,
      # not just a failing one (nextest's default only shows captured output
      # on failure).
      - name: Run restart_preserves_recall_at_10_against_brute_force (3k vectors) x N
        if: ${{ (github.event.inputs.load_runs || '0') == '0' && (github.event.inputs.probe_runs || '0') == '0' && (github.event.inputs.int_runs || '0') == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          N="${{ github.event.inputs.runs_per_os || '20' }}"
          for i in $(seq 1 "$N"); do
            echo "--- run $i/$N ---"
            NEXTEST=1 cargo nextest run --locked -p shamir-index --lib \
              -E 'test(restart_preserves_recall_at_10_against_brute_force)' \
              --success-output=immediate --no-fail-fast
          done
      - name: Run recall_at_10_on_1k_vectors x N
        if: ${{ (github.event.inputs.load_runs || '0') == '0' && (github.event.inputs.probe_runs || '0') == '0' && (github.event.inputs.int_runs || '0') == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          N="${{ github.event.inputs.runs_per_os || '20' }}"
          for i in $(seq 1 "$N"); do
            echo "--- run $i/$N ---"
            NEXTEST=1 cargo nextest run --locked -p shamir-index --lib \
              -E 'test(recall_at_10_on_1k_vectors)' \
              --success-output=immediate --no-fail-fast
          done
      # #1232 load repro: the 0.844 read happened inside the full workspace
      # lib run (6082 tests across 4 vCPUs), never in the isolated loops above
      # (120 runs, min 0.956). Re-create that load and print the SQ8 recall of
      # every iteration.
      - name: Full lib suite under load x load_runs (ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' && (github.event.inputs.load_runs || '0') != '0' }}
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          # The step shell runs with -e: a failing iteration must not end the loop.
          set +e
          N="${{ github.event.inputs.load_runs }}"
          for i in $(seq 1 "$N"); do
            echo "--- load run $i/$N ---"
            NEXTEST_SUCCESS_OUTPUT=immediate ./scripts/test.sh --locked > "load-$i.log" 2>&1
            rc=$?
            grep -a "recall_sq8_at_10=" "load-$i.log" || echo "no sq8 value"
            echo "exit=$rc"
            if [ "$rc" -ne 0 ]; then
              grep -aE "FAIL|TIMEOUT" "load-$i.log" | sort -u | head -20
              grep -a -m1 -A40 "FAIL" "load-$i.log" | cut -c1-300
            fi
          done
          exit 0
      # #1232 hang probe: the SQ8 fit-transition tests (concurrent_upsert_across_
      # threshold_no_loss, recall_sq8_vs_f32_within_two_percent) each timed out
      # once at 600s inside the full lib run with no output. Re-create CPU
      # contention (busy loops + nextest parallelism) and, when a test process
      # is stuck, dump every thread's stack so the blocking call is visible.
      - name: SQ8 hang probe x probe_runs (ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' && (github.event.inputs.probe_runs || '0') != '0' }}
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          sudo apt-get install -y gdb > /dev/null 2>&1
          N="${{ github.event.inputs.probe_runs }}"
          for b in 1 2 3 4 5 6; do (while :; do :; done) & done
          (
            while :; do
              for pid in $(pgrep -f 'shamir_index-.*(quantized_graph|recall_sq8|concurrent_upsert)'); do
                et=$(ps -o etimes= -p "$pid" | tr -d ' ')
                if [ "${et:-0}" -gt 90 ] && [ ! -e "/tmp/dumped-$pid" ]; then
                  touch "/tmp/dumped-$pid"
                  echo "=== HANG pid=$pid etimes=$et cmd=$(ps -o args= -p "$pid" | cut -c1-200)"
                  ps -L -o tid,pcpu,stat,wchan:30,comm -p "$pid"
                  sudo gdb -p "$pid" -batch -ex "thread apply all bt 30" 2>&1 | head -600
                  echo "=== END HANG pid=$pid"
                fi
              done
              sleep 10
            done
          ) &
          for i in $(seq 1 "$N"); do
            echo "--- probe run $i/$N ---"
            NEXTEST=1 cargo nextest run --locked -p shamir-index --lib -E 'test(quantized_graph_tests)' --no-fail-fast --success-output=immediate > "probe-$i.log" 2>&1
            rc=$?
            grep -a "recall_sq8_at_10=" "probe-$i.log"
            echo "exit=$rc"
            if [ "$rc" -ne 0 ]; then
              grep -aE "FAIL|TIMEOUT|SIGABRT" "probe-$i.log" | sort -u | head -10
            fi
          done
          kill $(jobs -p) 2>/dev/null
          exit 0
      # Flake census: the integration suite is where most remaining one-off
      # failures surface (one sample per CI run). Loop it and print each
      # failing test with its panic message.
      - name: Integration suite x int_runs (ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' && (github.event.inputs.int_runs || '0') != '0' }}
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          N="${{ github.event.inputs.int_runs }}"
          FILTER="${{ github.event.inputs.int_filter || 'kind(test)' }}"
          for b in $(seq 1 "${{ github.event.inputs.int_burners || '0' }}"); do (while :; do :; done) & done
          for i in $(seq 1 "$N"); do
            echo "--- integration run $i/$N ---"
            ./scripts/test.sh --full --locked -E "$FILTER" > "int-$i.log" 2>&1
            rc=$?
            echo "exit=$rc"
            if [ "$rc" -ne 0 ]; then
              grep -aE "FAIL|TIMEOUT" "int-$i.log" | sort -u | head -10
              grep -a -A4 "panicked at" "int-$i.log" | cut -c1-300 | head -60
              grep -a "DEBUG shamir_\|WARN \|ERROR " "int-$i.log" | grep -avE "SKIP|PASS|lsm_tree|fjall::" | cut -c1-300 | head -500
            fi
          done
          kill $(jobs -p) 2>/dev/null
          exit 0
