name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ready_for_review is what starts the FULL tier when a draft is promoted.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

# A newer push to the same PR cancels the older (superseded) run so it stops
# hogging the shared runner pool. Master pushes, scheduled and manual runs
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default. Every job here (fmt/clippy/test/integration/ts-unit/
# cooldown) only reads the repo and runs builds/tests — none pushes a commit,
# comments on a PR, or uploads to a registry, so no write scope is granted.
# (rust-cache + setup-node cache writes work under this scope — same pattern
# release.yml's gate jobs already rely on.)
permissions:
  contents: read

jobs:
  # FAST tier — draft pull requests only. ONE ubuntu job with a shared
  # cargo cache: cargo fmt, the affected-crates selector's unit tests, then
  # clippy + lib tests limited to the crates the PR can affect
  # (scripts/ci/affected_crates.py). Compile/lint errors surface in minutes
  # without queueing the 17-job full matrix. It never silently skips: a diff
  # the selector cannot bound runs --workspace; a docs-only diff runs fmt +
  # the selector's unit tests only. The FULL tier below (the merge gate)
  # runs for ready PRs, master pushes and workflow_dispatch.
  fast:
    name: fast tier (draft PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # full history: the affected-crates script diffs against origin/master
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo fmt --all -- --check
      - name: affected_crates.py unit tests
        run: python3 -I -m unittest discover -s scripts/ci/tests
      # Layout limits (CLAUDE.md): <=7 direct entries per folder, <=1000
      # physical lines per source file, ratcheted against the committed
      # scripts/ci/layout_baseline.txt. Instant, stdlib-only; runs
      # unconditionally, including docs-only diffs (which skip clippy/tests).
      - name: layout check
        run: python3 -I scripts/ci/check_layout.py
      - name: Determine affected crates
        id: affected
        run: |
          set -euo pipefail
          args="$(python3 scripts/ci/affected_crates.py --base origin/master)"
          if [ -n "$args" ] && [ "$args" != "--workspace" ]; then
            set -- $args
            if [ $(( $# % 2 )) -ne 0 ]; then
              echo "affected_crates.py produced unexpected output: $args" >&2
              exit 1
            fi
            while [ $# -gt 0 ]; do
              if [ "$1" != "-p" ]; then
                echo "affected_crates.py produced unexpected token: $1" >&2
                exit 1
              fi
              shift 2
            done
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          if [ -z "$args" ]; then
            echo "::notice::docs-only diff: clippy and lib tests are deliberately skipped in the fast tier"
          fi
      - name: cargo clippy (affected crates)
        if: steps.affected.outputs.args != ''
        env:
          AFFECTED: ${{ steps.affected.outputs.args }}
        run: |
          if [ "$AFFECTED" = "--workspace" ]; then
            cargo clippy --workspace --all-targets --locked -- -D warnings
          else
            cargo clippy --locked --all-targets $AFFECTED -- -D warnings
          fi
      # Same pinned nextest as the `test` job (see its comment above for the
      # perimeter-guard rationale).
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        if: steps.affected.outputs.args != ''
        with:
          tool: nextest@0.9.137
      - name: lib tests (affected crates)
        if: steps.affected.outputs.args != ''
        env:
          AFFECTED: ${{ steps.affected.outputs.args }}
        shell: bash
        run: |
          if [ "$AFFECTED" = "--workspace" ]; then
            ./scripts/test.sh --locked
          else
            ./scripts/test.sh --locked $AFFECTED
          fi
      # S5c-X P2 (Round 6): nextest cannot run doctests, so the boundary
      # compile-fail example on `TableManager` would never execute — run the
      # doctests explicitly (shamir-engine is the only crate with doctests
      # enabled; see its Cargo.toml `[lib]`).
      - name: doctests (shamir-engine compile-fail gate)
        if: steps.affected.outputs.args != ''
        env:
          AFFECTED: ${{ steps.affected.outputs.args }}
        shell: bash
        run: |
          if [ "$AFFECTED" = "--workspace" ]; then
            cargo test --doc -p shamir-engine --locked
          else
            case "$AFFECTED" in
              *shamir-engine*|*--workspace*) cargo test --doc -p shamir-engine --locked ;;
              *) echo "shamir-engine not affected; skipping doctests" ;;
            esac
          fi
      # CI-03b: the full-tier rustdoc gate, mirrored cheaply for drafts.
      # Same two cargo doc invocations as the `rustdoc` job (default and
      # --no-default-features), gated on shamir-engine being affected —
      # same case-guard style as the doctests step above.
      - name: rustdoc gate (shamir-engine, draft tier)
        if: steps.affected.outputs.args != ''
        env:
          AFFECTED: ${{ steps.affected.outputs.args }}
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        shell: bash
        run: |
          case "$AFFECTED" in
            *shamir-engine*|*--workspace*)
              cargo doc -p shamir-engine --no-deps --document-private-items --locked
              cargo doc -p shamir-engine --no-deps --document-private-items --locked --no-default-features
              ;;
            *) echo "shamir-engine not affected; skipping rustdoc gate" ;;
          esac

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: affected_crates.py unit tests
        run: python3 -I -m unittest discover -s scripts/ci/tests
      # FULL-tier layout check (same as the fast tier's; together the two
      # cover every PR and every master push).
      - name: layout check
        run: python3 -I scripts/ci/check_layout.py

  # Lint on every supported OS. Crucial for cross-platform correctness:
  # `#[cfg(windows)]` / `#[cfg(target_os = "macos")]` branches (service
  # installers, runtime, signal handling) are ONLY compiled — and therefore
  # only linted — on the matching OS. An ubuntu-only clippy never saw them.
  clippy:
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # CI-03b: rustdoc gate. Docs are code: a broken intra-doc link or an
  # accidentally-private documented item fails CI like any other compile
  # error (`-D` promotes both lints to errors via RUSTDOCFLAGS). Only
  # shamir-engine is documented in this stage (its `[lib]` doctest gate is
  # the compile-fail boundary); shamir-db / shamir-server rustdoc is a
  # known limitation for a later round. Runs once with default features
  # and once with none, so doc comments under feature-gated items resolve
  # in both configurations. ubuntu-only: rustdoc output is OS-independent.
  rustdoc:
    name: cargo doc (shamir-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine --no-deps --document-private-items --locked
      - env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine --no-deps --document-private-items --locked --no-default-features

  # CI-03b: engine feature matrix. Each cell compiles shamir-engine in
  # ISOLATION (`-p`, never a workspace invocation that could unify feature
  # defaults back in) with check + clippy, then asserts — via the pure-
  # manifest script scripts/ci/gates/features_matrix_check.py (unit-tested in
  # scripts/ci/tests/test_features_matrix_check.py) — that the ENABLED
  # feature set matches the cell exactly, so "no defaults" is proven, not
  # just labelled. Reduced-feature cells catch missing `cfg` guards that
  # the workspace-wide jobs unify away.
  engine-features:
    name: engine features (${{ matrix.cell.id }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cell:
          - { id: no-default, flags: "--no-default-features" }
          - { id: fjall, flags: "--no-default-features --features fjall" }
          - { id: test-util, flags: "--no-default-features --features test-util" }
          - { id: fjall-test-util, flags: "--no-default-features --features fjall,test-util" }
          - { id: default-plus, flags: "--features test-util,fts_indexed_long" }
          - { id: loom, flags: "--features loom" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: feature-resolution assertion
        run: python3 -I scripts/ci/gates/features_matrix_check.py --expected ${{ matrix.cell.id }} --flags="${{ matrix.cell.flags }}"
      - run: cargo check -p shamir-engine --all-targets --locked ${{ matrix.cell.flags }}
      - run: cargo clippy -p shamir-engine --all-targets --locked ${{ matrix.cell.flags }} -- -D warnings

  # CI-03b: fast-tier shadow of `engine-features` — cells 1 and 5 on
  # ubuntu, only while the PR is a draft AND shamir-engine is affected
  # (same affected-crates detection as the `fast` job). Cheap early
  # signal; the full matrix above is the merge gate.
  engine-features-fast:
    name: engine features fast (draft PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Determine affected crates
        id: affected
        run: |
          set -euo pipefail
          args="$(python3 scripts/ci/affected_crates.py --base origin/master)"
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: engine feature cells 1 and 5
        if: steps.affected.outputs.args != ''
        env:
          AFFECTED: ${{ steps.affected.outputs.args }}
        shell: bash
        run: |
          case "$AFFECTED" in
            *shamir-engine*|*--workspace*)
              python3 -I scripts/ci/gates/features_matrix_check.py --expected no-default --flags=--no-default-features
              python3 -I scripts/ci/gates/features_matrix_check.py --expected default-plus --flags='--features test-util,fts_indexed_long'
              cargo check -p shamir-engine --all-targets --locked --no-default-features
              cargo clippy -p shamir-engine --all-targets --locked --no-default-features -- -D warnings
              cargo check -p shamir-engine --all-targets --locked --features test-util,fts_indexed_long
              cargo clippy -p shamir-engine --all-targets --locked --features test-util,fts_indexed_long -- -D warnings
              ;;
            *) echo "shamir-engine not affected; skipping engine feature cells" ;;
          esac

  # Fast primary signal: the ~2700 library unit tests, on every OS. Matches
  # the project's stated pre-commit gate in CLAUDE.md ("Code quality
  # (MANDATORY)"): `./scripts/test.sh` (the nextest wrapper — raw
  # `cargo test` is blocked outright by the perimeter guard). Kept as its
  # own job so the dominant signal stays fast and is not held hostage by
  # the slower, heavier integration build below. Matrixed across OSes so
  # Windows / macOS regressions (path handling, file locking, fsync) are
  # caught.
  test:
    name: cargo test lib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      # Pinned to the cargo-nextest version documented as the perimeter-guard
      # baseline in .config/nextest.toml (0.9.137, commit 75ddba7e9). The
      # cargo-runner guard in .cargo/config.toml gates on the $NEXTEST env var
      # that cargo-nextest sets; pinning prevents a silent future upgrade from
      # renaming/removing it and fail-closing ALL test runs. The shorthand
      # `taiki-e/install-action@nextest` form cannot pin a version — the
      # full-form `@v2` + `with: { tool: "nextest@X.Y.Z" }` is required.
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # bash on every runner (Git Bash on Windows) — `./scripts/test.sh` is
      # a bash script; without this, GitHub Actions defaults `run:` steps
      # to PowerShell on windows-latest, which cannot execute it directly.
      # Parity with the `integration` job's own `shell: bash` below.
      - run: ./scripts/test.sh --locked
        shell: bash
      # S5c-X P2 (Round 6): nextest cannot run doctests — enforce the
      # shamir-engine boundary compile-fail gate explicitly (one OS is
      # enough; the fast-tier affected step covers the rest).
      - name: doctests (shamir-engine compile-fail gate)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cargo test --doc -p shamir-engine --locked

  # Integration gate: the test files under `crates/*/tests/`. Before this
  # job these only had to COMPILE (clippy --all-targets) — they never RAN
  # on a PR. This includes the only real fsync-durability-across-restart
  # coverage (`shamir-server/tests/server_meta.rs`, `persistence_e2e.rs`,
  # `backup_restore_e2e.rs`), the in-process server↔client TLS+SCRAM e2e
  # (`mvp_e2e.rs`, `mvp_ws_e2e.rs`, `shamir-client/tests/smoke.rs`), the
  # connection-cap / slow-loris defences (`max_connections.rs`,
  # `slow_loris.rs`) and the `shamir-db/tests/query_*.rs` wire-path suite.
  #
  # `--test '*'` selects ONLY the integration test targets. We deliberately
  # do NOT use `--all-targets` here: that also builds and *runs* the
  # `criterion` benches (each `bench` target has a real `fn main` via
  # `criterion_main!`), so `cargo test --all-targets` would execute the
  # full benchmark suites — slow and pointless as a correctness gate.
  #
  # Thread policy: default (parallel). Every integration test was audited
  # to be parallel-safe — each uses its own `tempfile::TempDir` and binds
  # TCP listeners to an ephemeral port (`127.0.0.1:0`, OS-assigned), so
  # there are no shared-disk-path or fixed-port collisions across tests.
  # (The one fixed-relative-path test, `storage_sled::test_sled_transact_atomic`
  # at `./test_data/sled_transact`, is a `--lib` test gated by the `test`
  # job above, not an integration target, and uses a path unique to that
  # test — it does not collide with siblings.) If a future integration
  # test introduces a shared-path/fixed-port hazard, gate it with
  # `serial_test::#[serial]` (already a dev-dependency) rather than
  # forcing `--test-threads=1` on the whole suite.
  #
  # NOTE: the Node.js napi e2e suite under `tests/e2e/` AND the TS client
  # e2e suite (`crates/shamir-client-ts/src/__tests__/**/e2e-*.test.ts`) are
  # intentionally NOT wired into this per-PR gate — both require a release
  # `shamir-server` build (and the napi one needs the MSVC-built
  # `shamir-client-node` binding, excluded from the workspace), too heavy
  # for every PR. They now run on the scheduled nightly workflow
  # `.github/workflows/ts-e2e-nightly.yml` (cron + `workflow_dispatch`).
  # The pure-TS unit tests for `shamir-client-ts` ARE gated per-PR — see the
  # `ts-unit` job below (the e2e-* suites self-skip there because no server
  # binary is built in that job).
  # Matrixed across OSes — this is the suite that actually exercises sockets,
  # TLS+SCRAM, fsync-durability-across-restart, and the storage backends'
  # on-disk file locking, where OS differences bite hardest.
  integration:
    name: cargo test integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      # Pinned to the cargo-nextest version documented as the perimeter-guard
      # baseline in .config/nextest.toml (0.9.137, commit 75ddba7e9). The
      # cargo-runner guard in .cargo/config.toml gates on the $NEXTEST env var
      # that cargo-nextest sets; pinning prevents a silent future upgrade from
      # renaming/removing it and fail-closing ALL test runs. The shorthand
      # `taiki-e/install-action@nextest` form cannot pin a version — the
      # full-form `@v2` + `with: { tool: "nextest@X.Y.Z" }` is required.
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # bash on every runner (Git Bash on Windows). `-E 'kind(test)'` selects
      # ONLY integration test binaries (crates/*/tests/*.rs) — the nextest
      # filterset equivalent of cargo's `--test '*'` target selector; it
      # deliberately excludes `kind(lib)` (covered by the `test` job above)
      # and `kind(bench)` (never a correctness gate).
      - run: ./scripts/test.sh --full --locked -E 'kind(test)'
        shell: bash

  # Pure-TypeScript unit tests for `crates/shamir-client-ts` (query
  # builders, framing, hmac, msgpack round-trips — the
  # `src/core/**/__tests__/*.test.ts` surface). Cheap (seconds), no Rust
  # toolchain and no server binary needed.
  #
  # The TS package's `npm test` (vitest run) ALSO collects the
  # `src/__tests__/**/e2e-*.test.ts` suites, but those self-skip via
  # `describe.skipIf(!SERVER_AVAILABLE)` when no `shamir-server` release
  # binary is resolvable (see `src/__tests__/e2e-harness.ts`'s
  # `SERVER_AVAILABLE` / `serverBinPath()`: `SHAMIR_SERVER_BIN` →
  # `$CARGO_TARGET_DIR/release/<exe>` → `<repo>/target/release/<exe>`).
  # This job sets NONE of those and runs no `cargo build`, so
  # `SERVER_AVAILABLE` is false and ONLY the pure unit tests execute — the
  # e2e-* suites run for real in `ts-e2e-nightly.yml` instead.
  #
  # ubuntu-only: pure TS, no OS-specific behaviour (these tests assert wire
  # shapes and builder output, not filesystem or socket semantics).
  ts-unit:
    name: ts unit (shamir-client-ts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Path gate: on pull_request, run the payload steps only when the TS
      # package (or this workflow) changed. Non-PR events always run (the
      # output is empty then). No third-party action needed.
      - name: Did the TS package change?
        id: ts_changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed=true
          if files="$(git diff --name-only "$base...HEAD" -- crates/shamir-client-ts .github/workflows/ci.yml)"; then
            if [ -z "$files" ]; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.ts_changes.outputs.changed != 'false'
        with:
          # Node 22 = active LTS. `shamir-client-ts/package.json` declares
          # no `engines` floor; `shamir-client-node`'s is `>=18`, so 22
          # satisfies both. Pinned for reproducibility.
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/shamir-client-ts/package-lock.json
      - run: npm ci && npm run typecheck && npm test
        if: steps.ts_changes.outputs.changed != 'false'
        working-directory: crates/shamir-client-ts

  # Supply-chain cooldown gate (RFC 3923, fail-closed) — fails the PR if
  # resolving the workspace would pull a crate version younger than 30 days
  # (config: /cooldown.toml). The `--locked` flags above keep the other jobs on
  # the committed Cargo.lock; THIS job catches a PR that introduces a too-fresh
  # dependency. Native cargo support is pending, so we use the cargo-cooldown
  # subcommand. `check` restores the original lock if enforcement fails.
  cooldown:
    name: dependency cooldown (30d)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # Pinned: an unpinned supply-chain-freshness tool silently changing
      # behavior between CI runs is exactly the kind of drift a "cooldown"
      # gate exists to prevent for the WORKSPACE's dependencies — it would
      # be inconsistent to leave the gate tool itself unpinned. `--locked`
      # only pins cargo-cooldown's OWN internal Cargo.lock during its build,
      # NOT which published version gets installed (same misconception
      # corrected for cargo-nextest in the nextest pin above). `--version`
      # pins the exact crates.io release. When upgrading, bump the version
      # here to match.
      - run: cargo install --locked --version 0.3.4 cargo-cooldown
      - run: cargo cooldown check

  # F-80 (#907) — loom model-checker gate for the WriterDrainBarrier
  # interleaving contract (F-56, #882). This is the proof mechanism
  # referenced in three P0-fix doc comments (F-56/F-69/F-70); before this
  # job it existed but never ran in CI, so a future edit could silently
  # break the proven contract with nothing catching it before a human
  # happened to run the loom command by hand.
  #
  # Standalone job (not a step in `test`): needs a different feature flag
  # (`--features loom`), and model-checking is conceptually distinct from
  # correctness testing — keeping it separate lets it fail without noise
  # in the primary test signal, and vice versa.
  #
  # ubuntu-only (not matrixed): loom mocks the atomic operations
  # themselves — the model has no OS-specific behavior to exercise (no
  # sockets, no fsync, no file locking). CPU-bound model enumeration.
  #
  # Hard PR gate (blocks merge): the loom model is the interleaving-contract
  # proof backing three P0 fixes. It runs in ~0.2s (verified locally), well
  # within per-PR budget — no flakiness or runtime concern.
  #
  # Uses cargo-nextest (not bare `cargo test`): the `.cargo/config.toml`
  # perimeter guard blocks bare `cargo test` in CI too (it is committed).
  # Nextest passes the guard via $NEXTEST — same pattern every other test
  # job in this file uses. The loom model is a regular `#[test]`; nextest
  # discovers and runs it identically.
  loom-model:
    name: loom model (writer_drain_barrier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # The `loom` feature triggers build.rs to emit `cfg(loom)` for THIS
      # crate only (not globally), so dependencies aren't dragged into
      # incompatible loom code paths. The `-E 'test(loom_model)'` filter
      # runs just the model-checker test (excluded from test.sh by design).
      # Discovery gate (CI-03b): fail BEFORE running when the filterset
      # matches zero tests — a renamed/moved/gated-away model must not
      # silently turn this job into a vacuous pass. nextest's own
      # `--no-tests=fail` (supported since 0.9.x, and by the pinned
      # 0.9.137) backs the same rule at run time.
      - name: discover loom model tests (must be non-empty)
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest list -p shamir-engine --features loom --lib -E 'test(loom_model)' --message-format json > loom_list.json
          python3 -I scripts/ci/gates/loom_preflight_check.py --list-file loom_list.json --name-filter loom_model
          rm -f loom_list.json
      - run: cargo nextest run -p shamir-engine --features loom --lib -E 'test(loom_model)' --nocapture --no-tests=fail

  # rust-guard source-integrity gates (CI-03a). Runs the workspace-excluded
  # `tools/rust-guard` binary against the whole repo: `modules` (every
  # tracked `.rs` reachable from a target root or excepted), `structure`
  # (AST rules over the PR's changed files only — the VIS_WIDENING /
  # ALLOW_ADDED rules are diff-shaped by nature; on master pushes only
  # the whole-repo `modules` scan runs), and both `structure` and
  # `conservation` run only for touched packages in active campaigns in
  # `.rust-guard/stages.toml` (a no-op while that list is empty). Also re-runs the baseline-monotonic
  # and layout checks next to the tool whose findings they ratchet.
  #
  # Runs on draft AND ready PRs and master pushes (no draft-only `if:`):
  # the gates are cheap (seconds) and the whole point is catching structural
  # drift the moment it is written, not when the draft is promoted. The tool
  # is workspace-excluded, so the main fmt/clippy jobs never cover it — its
  # own fmt/clippy run here too. ubuntu-only: the tool parses git objects
  # and Rust sources; nothing OS-specific.
  source-integrity:
    name: rust-guard source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # full history: merge-base computation, `git show <rev>:<path>`
          # reads and the baseline check all need real git objects.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt, clippy
      # Distinct cache scope so this job's build of the standalone tool does
      # not fight the workspace cache the other jobs share.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: tools/rust-guard
      # PRs only: on master pushes there is no merge base (HEAD *is*
      # master); the diff-shaped `structure`/`conservation` gates are
      # skipped there, the whole-repo `modules` scan still runs below.
      - name: compute merge base
        if: github.event_name == 'pull_request'
        run: echo "MERGE_BASE=$(git merge-base origin/master HEAD)" >> "$GITHUB_ENV"
      - name: build rust-guard
        run: cargo build --manifest-path tools/rust-guard/Cargo.toml --locked
      - name: rust-guard modules (whole repo)
        run: tools/rust-guard/target/debug/rust-guard modules --repo .
      # Selection lives in scripts/ci/rust_guard_select.py (unit-tested in
      # scripts/ci/tests/test_rust_guard_select.py): it reads the changed
      # files on stdin, captures `cargo metadata` to a file ONCE, strips the
      # repo root from absolute manifest paths and emits package directories.
      # Any parse / usage error exits 2 — the step fails closed.
      - name: rust-guard campaign gates
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          git diff --name-only "$MERGE_BASE"...HEAD \
            | python3 -I scripts/ci/rust_guard_select.py \
                --stages .rust-guard/stages.toml \
                --metadata metadata.json --root . > campaigns.tsv
          guard="tools/rust-guard/target/debug/rust-guard"
          ran=0
          while IFS=$'\t' read -r name delta pkgs dirs; do
            [ -n "$name" ] || continue
            echo "::notice::structure+conservation campaign '$name' (packages: $pkgs)"
            scope_args=()
            IFS=',' read -ra scope_dirs <<< "$dirs"
            for dir in "${scope_dirs[@]}"; do scope_args+=(--scope "$dir"); done
            "$guard" structure --repo . --changed-since "$MERGE_BASE" "${scope_args[@]}"
            "$guard" conservation --repo . \
              --base "$MERGE_BASE" --head HEAD \
              --packages "$pkgs" --delta "$delta"
            ran=1
          done < campaigns.tsv
          rm -f metadata.json campaigns.tsv
          if [ "$ran" -eq 0 ]; then
            echo "::notice::no active campaign package touched by this diff; structure and conservation skipped"
          fi
      # Same ratchet the fmt job runs; repeated here so the source-integrity
      # job is self-contained (cheap, stdlib-only).
      - name: baseline monotonic check
        run: python3 -I scripts/ci/check_baseline_monotonic.py --base "origin/master" --head HEAD
      - name: layout check
        run: python3 -I scripts/ci/check_layout.py
      # The tool is workspace-excluded: the main fmt/clippy jobs never see
      # it, so it lints itself here.
      - run: cargo fmt --manifest-path tools/rust-guard/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/rust-guard/Cargo.toml --all-targets --locked -- -D warnings

  # CI-03b: compiled test-discovery diff (`rust-guard discovery`).
  # Compares `cargo nextest list --message-format json` inventories of
  # shamir-engine at the merge base (built in a throwaway git worktree
  # under a DIFFERENT CARGO_TARGET_DIR, then cached by base SHA + OS +
  # config — never across configurations) against the current tree, for
  # the default configuration and the test-util,fts_indexed_long one.
  # Runs only when .rust-guard/stages.toml has an active campaign whose
  # packages the diff touches (scripts/ci/rust_guard_select.py); with
  # `campaigns = []` the selection step prints a notice and the job
  # passes (no-op). Full tier on ubuntu + windows + macos; the merge-gate
  # wiring arrives with the aggregate-gate chunk.
  test-discovery:
    name: test discovery (${{ matrix.os }}, ${{ matrix.config.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config:
          - { id: default, flags: "" }
          - { id: test-util-fts, flags: "--features test-util,fts_indexed_long" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # full history: merge-base computation and the base worktree
          # both need real git objects.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      # Pinned to the cargo-nextest version documented as the perimeter-guard
      # baseline in .config/nextest.toml (0.9.137) — same pin as every
      # other nextest job in this file. Both lists MUST come from the
      # same nextest version for the comparison to be meaningful.
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # On master pushes there is no merge base (HEAD *is* master); the
      # discovery diff is a PR-shaped gate and is skipped there.
      # shell: bash — windows-latest defaults to PowerShell, where the
      # `>> "$GITHUB_ENV"` append syntax is wrong.
      - name: compute merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "MERGE_BASE=$(git merge-base origin/master HEAD)" >> "$GITHUB_ENV"
      # Always built (un-gated): the campaign-gated steps below need it only
      # when a campaign is active, but the format smoke below always needs
      # the binary — one cargo build serves both.
      - name: build rust-guard
        run: cargo build --manifest-path tools/rust-guard/Cargo.toml --locked
      # FORMAT SMOKE — runs BEFORE and independent of the campaign gate:
      # proves the discovery tool round-trips REAL `cargo nextest list`
      # output on the default config (ubuntu only). shamir-collections has
      # no lib tests; shamir-types is the smallest crate that clearly does
      # (#[test] modules under crates/shamir-types/src/**/tests/).
      - name: format smoke (real nextest output must round-trip)
        if: matrix.os == 'ubuntu-latest' && matrix.config.id == 'default'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch
          cargo nextest list -p shamir-types --lib --message-format json > .scratch/smoke.json
          printf 'base = "smoke"\n' > .scratch/empty-delta.toml
          tools/rust-guard/target/debug/rust-guard discovery \
            --base-list .scratch/smoke.json \
            --head-list .scratch/smoke.json \
            --delta .scratch/empty-delta.toml \
            --kind lib
          printf '{"rust-suites":{},"test-count":0}' > .scratch/empty.json
          if tools/rust-guard/target/debug/rust-guard discovery \
            --base-list .scratch/empty.json \
            --head-list .scratch/empty.json \
            --delta .scratch/empty-delta.toml \
            --kind lib; then
            echo "::error::empty list passed vacuously"
            exit 1
          else
            echo "empty list correctly rejected"
          fi
          python3 -I scripts/ci/gates/loom_preflight_check.py --list-file .scratch/smoke.json
          rm -rf .scratch
      # Same selection as the source-integrity job: rows are
      # name<TAB>delta<TAB>packages<TAB>dirs for touched campaign
      # packages; an empty file means no-op (notice + pass).
      - name: campaign selection
        id: select
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          git diff --name-only "$MERGE_BASE"...HEAD \
            | python3 -I scripts/ci/rust_guard_select.py \
                --stages .rust-guard/stages.toml \
                --metadata metadata.json --root . > campaigns.tsv
          rm -f metadata.json
          if [ -s campaigns.tsv ]; then
            echo "campaigns=yes" >> "$GITHUB_OUTPUT"
            while IFS=$'\t' read -r name delta pkgs dirs; do
              echo "::notice::test-discovery campaign '$name' (packages: $pkgs)"
            done < campaigns.tsv
          else
            echo "::notice::no active campaign package touched by this diff; test discovery skipped"
          fi
          rm -f campaigns.tsv
      # Base list cache, keyed by base SHA + OS + config — NEVER shared
      # across configurations.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: base_list_cache
        if: steps.select.outputs.campaigns != ''
        with:
          path: base-list.json
          key: test-discovery-base-${{ matrix.os }}-${{ env.MERGE_BASE }}-${{ matrix.config.id }}
      # The base list is produced in a worktree of the merge base with a
      # separate CARGO_TARGET_DIR, so base and head never share build
      # artifacts and the toolchain/features stay identical (same
      # nextest pin, same ${{ matrix.config.flags }}). bash + $RUNNER_TEMP
      # on every runner (Git Bash on windows-latest).
      - name: base list (worktree at merge base)
        if: steps.select.outputs.campaigns != '' && steps.base_list_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add .scratch-ci-base "$MERGE_BASE"
          (
            cd .scratch-ci-base
            CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" \
              cargo nextest list -p shamir-engine ${{ matrix.config.flags }} --message-format json
          ) > "$GITHUB_WORKSPACE/base-list.json"
          git worktree remove --force .scratch-ci-base
      - name: head list
        if: steps.select.outputs.campaigns != ''
        shell: bash
        run: cargo nextest list -p shamir-engine ${{ matrix.config.flags }} --message-format json > head-list.json
      # Findings (lost test, duplicate, lost target, empty list, blocked
      # comparison) fail the step — the gate is fail-closed.
      - name: discovery diff (fails on findings)
        if: steps.select.outputs.campaigns != ''
        shell: bash
        run: |
          tools/rust-guard/target/debug/rust-guard discovery \
            --base-list base-list.json \
            --head-list head-list.json \
            --kind lib

  # The tool's own test suite (`tools/rust-guard/tests/`). Runs in CI ONLY —
  # CLAUDE.md bans local builds/tests. The crate is workspace-excluded, so
  # the `test` job above never runs these. Same perimeter-guard constraint
  # as the loom job: raw `cargo test` is blocked by the committed
  # .cargo/config.toml runner even in CI, so tests go through cargo-nextest
  # (the wrapper the guard sanctions). ubuntu-only: pure std + syn parsing,
  # nothing OS-specific.
  rust-guard-selftest:
    name: rust-guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af  # v2.87.11
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: tools/rust-guard
      - working-directory: tools/rust-guard
        run: cargo nextest run --locked --no-fail-fast
      - run: cargo fmt --manifest-path tools/rust-guard/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/rust-guard/Cargo.toml --all-targets --locked -- -D warnings

# CI-03b deliverable 4: the aggregate merge gate — the ONE required check.
# `if: always()` + full `needs:` so it evaluates even when jobs were
# skipped, and the stdlib script scripts/ci/gates/merge_gate_check.py
# (unit tests: scripts/ci/tests/test_merge_gate_check.py) decides from
# toJSON(needs): failure/cancelled anywhere fails; skipped fails unless
# by design for the tier (draft PR: full tier skipped, fast must pass;
# ready/master/dispatch: fast skipped by design). A DRAFT PR always
# fails this gate with "draft PR: full matrix not run, not merge-ready"
# — draft fast-tier success never authorises a merge. needs comes in via
# the NEEDS_JSON env var (never string-interpolated into the shell line)
# to avoid quoting/injection breakage. Read-only, stdlib-only python:
# no permissions beyond the workflow default, no toolchain.
  merge-gate:
    name: merge gate (required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [fast, fmt, clippy, test, integration, ts-unit, cooldown, loom-model, source-integrity, rust-guard-selftest, rustdoc, engine-features, test-discovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | python3 -I scripts/ci/gates/merge_gate_check.py --event ${{ github.event_name }} --draft ${{ github.event.pull_request.draft == true }}
