name: perf-gate

# F-53d (#877) — release-blocking performance gate.
#
# WHY SELF-HOSTED, NOT ubuntu-latest: absolute ns/op timing gates need a
# STABLE machine. GitHub-hosted runners are shared-tenancy and too noisy for
# that — this repo's own docs/dev-artifacts/checkpoints/2026-07-22-1747.md
# records 9 separate CI timing-margin flakes on hosted runners. A dedicated
# self-hosted box gives comparable absolute numbers run to run. This is a
# deliberate, already-made decision (see the brief this workflow was built
# from, docs/dev-artifacts/prompts/post-alpha/110-f53d-ci-perf-gates-self-hosted.md)
# — do not "fix" the flakiness below by switching `runs-on` back to a
# GitHub-hosted label.
#
# WHY THIS JOB WILL SIMPLY QUEUE FOREVER RIGHT NOW: `runs-on: [self-hosted,
# shamir-bench]` targets a runner label that has NO machine registered
# against it yet — registering one is a manual, out-of-band operator step
# (see docs/guide-docs/CI_PERF_GATE_RUNBOOK.md). Until that happens, a
# manually-triggered run (see the workflow_dispatch note below) will show
# this job stuck in "Queued" indefinitely. That is EXPECTED, not a
# misconfiguration — do not delete this workflow or change its `runs-on`
# to make the queue go away; register the runner instead, per the
# runbook.
#
# WHY MANUAL (workflow_dispatch) ONLY, NOT `pull_request` (F-61, #887):
# this repository is PUBLIC (verified via `gh repo view` — not a future
# concern, the current state). A `pull_request`-triggered workflow checks
# out and executes the PR's OWN code — `cargo bench` compiles and runs
# whatever `build.rs`/proc-macros/benches the PR supplies — and this job
# runs on a PERSISTENT self-hosted machine, not a disposable per-job VM.
# Any fork could open a PR against `master` and get arbitrary code
# execution on that machine the moment a runner is registered against the
# `shamir-bench` label. `workflow_dispatch` requires a maintainer (someone
# with at least write access) to manually trigger a run — that is the
# safety boundary for now. This is an intentional trade-off: the gate no
# longer runs unattended on every PR, in exchange for not handing code
# execution on a persistent machine to anonymous fork PRs. Do NOT add
# `pull_request` back, and do NOT reach for `pull_request_target` as an
# alternative — that trigger runs with the base repo's privileged token
# while still able to check out untrusted PR code if misused, a
# well-known WORSE version of this same vulnerability class. A stronger
# mechanism (maintainer-approval-gated trusted workflow benchmarking an
# immutable PR SHA, or a genuinely ephemeral no-secrets runner) may be
# worth building later if unattended PR coverage becomes valuable again —
# not implemented here.

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default, same as ci.yml / stress-nightly.yml: this job
# only reads the repo and runs benches — no push/comment/registry write.
permissions:
  contents: read

jobs:
  perf-gate:
    name: performance gate (self-hosted)
    # See the header comment above: this label has no runner registered
    # against it yet in this environment. That is expected until the
    # runbook's manual registration step is completed by a human operator.
    runs-on: [self-hosted, shamir-bench]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: dtolnay/rust-toolchain@d0befba8b9ddf874327619e84c39b094edd58b66  # 1.93.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      # bash on every runner (Git Bash on Windows) — `./scripts/bench_gate.sh`
      # is a bash script, same convention as `./scripts/test.sh` in ci.yml.
      - name: run performance gate
        run: ./scripts/bench_gate.sh
        shell: bash
