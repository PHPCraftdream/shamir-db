name: supply-chain

# Scheduled supply-chain jobs (audit C1). The per-push / per-PR policy gate
# (`cargo deny check`: licenses, bans, sources, advisories, plus the npm licence
# check) moved into ci.yml as the `deny` job so it is part of the aggregate
# `merge gate (required)`; this workflow keeps only the jobs that run on a
# schedule or on demand:
#
#  - `audit` (weekly + manual): RUSTSEC advisories are published continuously
#    and independently of this repo's commits, so a dependency that was clean
#    when merged can become advisory-flagged weeks later. `cargo audit` and
#    `cargo deny check advisories` overlap intentionally.
#
#  - `exceptions-expiry` (weekly + manual): reports expiring or expired
#    cooldown exceptions (cooldown-exceptions.toml).
#
#  - `sbom` (manual): generates a CycloneDX SBOM per workspace member. Release-
#    tag SBOMs are produced by `.github/workflows/release.yml`, whose `sbom`
#    job mirrors this one's pinned cargo-cyclonedx recipe.

on:
  schedule:
    # Sundays 03:17 UTC — picked off the top/bottom of the hour to ease load on
    # the shared GitHub Actions runner pool. Weekly matches the dependabot
    # cadence in dependabot.yml so audit findings and Dependabot update PRs
    # arrive in the same weekly window.
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

# A newer push to the same PR cancels the older (superseded) run; master
# pushes, scheduled and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Least-privilege default. The three jobs (audit/sbom/exceptions-expiry) only read the repo
# and run offline cargo checks / SBOM generation. `sbom` uploads a workflow-run
# artifact, which works under this scope (same pattern as release.yml's
# build/sbom jobs) — no `actions: write` exception needed.
permissions:
  contents: read

jobs:
  # Periodic advisory scan. Scheduled + manual only (not per-push) because the
  # advisory database evolves independently of commits — running it on every PR
  # would flap the gate on advisories that don't touch our locked versions.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Only the scheduled + manual triggers want this job. On push/PR the `deny`
    # job above already covers the advisory-db check against the PR's lockfile;
    # this job's value is the time-decoupled re-scan.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - name: Install cargo-audit
        # Pinned: `--version` pins the exact crates.io release (`--locked` only pins
        # cargo-audit's own lockfile).
        run: cargo install --locked --version 0.22.2 cargo-audit
      # `--file Cargo.lock` pins the scan to the committed lockfile (no network
      # resolution). `--ignore` is intentionally absent here — every advisory
      # audit finds should surface. If a finding is a genuine false positive or
      # a triaged-yet-unpatched case, silence it via the ignore list in a
      # committed config (`.cargo/audit.toml`) with a reason + tracking issue,
      # not via a CI flag that lives only in the workflow.
      - name: cargo audit
        run: cargo audit --file Cargo.lock

  # On-demand CycloneDX SBOM generation (release-audit report 03, P7 / row 7c).
  # Produces machine-readable dependency inventory for release evidence.
  # `workflow_dispatch`-only: see the top-of-file rationale for why no tag
  # trigger is wired yet.
  sbom:
    name: cargo cyclonedx (SBOM)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - name: Install cargo-cyclonedx
        # Pinned: `--version` pins the exact crates.io release (`--locked` only pins
        # cargo-audit's own lockfile).
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # `-f json` emits CycloneDX JSON (widely consumed by SBOM tooling).
      # `--spec-version 1.5` is the latest CycloneDX spec. The tool produces
      # one `<crate-name>.cdx.json` per workspace member (per-crate
      # dependency trees), placed adjacent to each crate's `Cargo.toml` —
      # verified locally against this workspace: 23 files, one per member
      # crate declared in the root Cargo.toml's `members = ["crates/*"]`.
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx -f json --spec-version 1.5
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx-${{ github.run_id }}
          path: crates/*/*.cdx.json
          if-no-files-found: error

  # Weekly reconciliation of the cooldown exceptions (cooldown-exceptions.toml):
  # fails on an expired or unused entry and warns in the last week before
  # expiry, so a version that matured is cleaned up even without a PR touching
  # the lockfile. Policy: /cooldown.toml.
  exceptions-expiry:
    name: cooldown exceptions expiry
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python3 -I scripts/ci/gates/dependency_admission_check.py --expiry-only
