name: flake-loop

# Manual flake hunt (FLAKE-2): runs the two Windows-flaky shutdown tests in a
# loop with full logs. Dispatch with `gh workflow run flake-loop.yml --ref <branch>`.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Crate to test (scripts/test.sh -p)
        type: string
        default: shamir-db
      filters:
        description: Space-separated nextest name filters
        type: string
        default: durability_levels_tests durability_policy_tests
      iterations:
        description: How many times to run the filtered tests
        type: string
        default: '30'
  # A workflow that exists only on a branch cannot be dispatched through the
  # API, so the FLAKE-2 branch also runs it when this file changes.
  push:
    branches: [fix/windows-flush-stall]
    paths: [".github/workflows/flake-loop.yml"]

jobs:
  flake-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Same pinned nextest the CI jobs use (`scripts/test.sh` requires it).
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - name: Run target tests in a loop with full logs
        shell: bash
        env:
          FLAKE_PACKAGE: ${{ inputs.package || 'shamir-db' }}
          FLAKE_FILTERS: ${{ inputs.filters || 'durability_levels_tests durability_policy_tests' }}
          FLAKE_ITERATIONS: ${{ inputs.iterations || '30' }}
        run: |
          failed=0
          logdir="$PWD/flake-logs"
          mkdir -p "$logdir"
          for i in $(seq 1 "${FLAKE_ITERATIONS}"); do
            log="$logdir/iteration-$i.log"
            echo "=== iteration $i ==="
            # `shell: bash` runs with -e: capture the exit code explicitly so a
            # failing iteration does not end the loop.
            rc=0
            # shellcheck disable=SC2086 # the filters are a space-separated list on purpose
            ./scripts/test.sh -p "${FLAKE_PACKAGE}" -- ${FLAKE_FILTERS} >"$log" 2>&1 || rc=$?
            echo "=== iteration $i exit code: $rc ==="
            grep -E "SLOW|FAIL|TIMEOUT|shutdown stage slow" "$log" || true
            if [ "$rc" -ne 0 ]; then
              failed=1
              echo "=== iteration $i FAILED; full log follows ==="
              cat "$log"
            fi
          done
          echo "logs kept at: $logdir"
          exit "$failed"
      - name: Upload iteration logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: flake-logs-${{ matrix.os }}
          path: flake-logs/
