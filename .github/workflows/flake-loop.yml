name: flake-loop

# Manual flake hunt (FLAKE-2): runs the two Windows-flaky shutdown tests in a
# loop with full logs. Dispatch with `gh workflow run flake-loop.yml --ref <branch>`.
on:
  workflow_dispatch:
  # A workflow that exists only on a branch cannot be dispatched through the
  # API, so the FLAKE-2 branch also runs it when this file changes.
  push:
    branches: [fix/windows-flush-stall]
    paths: [".github/workflows/flake-loop.yml"]

jobs:
  flake-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Same pinned nextest the CI jobs use (`scripts/test.sh` requires it).
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Run target tests 30x with full logs
        shell: bash
        run: |
          failed=0
          logdir="$PWD/flake-logs"
          mkdir -p "$logdir"
          for i in $(seq 1 30); do
            log="$logdir/iteration-$i.log"
            echo "=== iteration $i ==="
            # `shell: bash` runs with -e: capture the exit code explicitly so a
            # failing iteration does not end the loop.
            rc=0
            ./scripts/test.sh -p shamir-db -- durability_levels_tests durability_policy_tests >"$log" 2>&1 || rc=$?
            echo "=== iteration $i exit code: $rc ==="
            grep -E "SLOW|FAIL|TIMEOUT|shutdown stage slow" "$log" || true
            if [ "$rc" -ne 0 ]; then
              failed=1
              echo "=== iteration $i FAILED; full log follows ==="
              cat "$log"
            fi
          done
          echo "logs kept at: $logdir"
          exit "$failed"
      - name: Upload iteration logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flake-logs-${{ matrix.os }}
          path: flake-logs/
