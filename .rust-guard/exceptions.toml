reason = "needs Client::for_test, client::LifecycleHooks, and the pub(crate) Client::roundtrip to drive a raw FetchNext"
owner = "@phpcraftdream"

[[exception]]
path = "crates/devtools/shamir-e2e/tests/internals/interner_cache_tests.rs"
