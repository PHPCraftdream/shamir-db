# engine-truncation-pin-R2a-1 campaign (its stages.toml entry and delta
# files are removed by this campaign's PR, per tools/rust-guard/README.md).
# Base is git merge-base origin/master HEAD.
# Static source inspection only; rust-guard execution is CI-only.
#
# Exact keys transcribed from the read-only rust-guard AST implementation
# (tools/rust-guard/src/commands/structure_cmd/diff.rs):
# - check_vis (existing files) reports an item whose visibility rank GREW
#   between base and head (private < pub(super) < pub(crate) < pub);
#   brand-new items in existing files are skipped.
# - check_new_file (new files) reports every item at pub(crate)+ EXCEPT
#   `mod` declarations; private items and fields are below the threshold.
#
# Widening inventory against base 80175e0167ea9d1eddc09a0a897236059ff311f9:
# 1. tx/drain/truncation_pin_guard.rs — `TruncationPinGuard`
#    pub(crate) -> pub (existing item; the R2a-3 facade
#    `RepoInstance::acquire_truncation_pin` returns it across the crate edge).
# 2. tx/drain/mod.rs — `truncation_pin_guard` module declaration
#    pub(crate) -> pub (check_vis covers `mod` items in existing files).
# 3. New file online_backup.rs — pub items: OnlineBackupError, SealHold,
#    SealHold::position, SealHold::held_since, RepoInstance::capture_point,
#    RepoInstance::seal_point, RepoInstance::acquire_truncation_pin,
#    RepoInstance::set_online_backup_step_hook (test-util feature gate is
#    production for cfg composition). Private items/fields skipped.
# 4. New file drain_pause.rs — pub(crate) items: DrainPauseBusy,
#    DrainPauseState, DrainPauseState::new, DrainPauseState::is_held,
#    DrainPauseState::acquire, DrainPauseGuard (fields private; Drop is
#    private). `pub(crate) mod drain_pause` declaration is skipped by
#    check_new_file (kind `mod`).
# 5. New file admission/tests/close_helpers.rs — `close` (pub(crate) fn).
# Everything else the diff adds is either private, a new item in an
# existing file (skipped by check_vis), or a new `mod` declaration
# (skipped by check_new_file). No new #[allow] attributes, so no
# ALLOW_ADDED entries. Counts: 16 allow_widen.

