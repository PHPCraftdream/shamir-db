[workspace]
members = ["crates/*"]
resolver = "2"

# napi-rs cdylib needs the MSVC toolchain on Windows (it delay-loads
# Node-API symbols from `node.exe` via `delayimp.lib`, which the
# build script only wires up for `x86_64-pc-windows-msvc`). Excluded
# from default workspace ops so `cargo build` / `cargo test` on the
# host's `windows-gnu` toolchain don't fail trying to link `libnode.dll`.
# Build it explicitly via `cargo build -p shamir-client-node` (its own
# `rust-toolchain.toml` pins MSVC) or `napi build` from `npm`.
# `shamir-client-ts` is a pure-TypeScript package (no Cargo.toml); exclude it
# so the `crates/*` glob doesn't try to load it as a workspace member.
exclude = ["crates/shamir-client-node", "crates/shamir-client-ts"]

[workspace.dependencies]
# Published on crates.io (https://crates.io/crates/captrack, repo
# https://github.com/PHPCraftdream/captrack). Pinned exact (`=0.1.1`) rather
# than a caret range so (a) the supply-chain cooldown's lockfile-baseline stays
# stable, and (b) `cargo deny` / downstream consumers cannot silently pick up a
# future 0.1.x/0.2 that hasn't been reviewed here. Was a non-reproducible
# `path = "D:/dev/rust/captrack"` (audit C1). 0.1.1 fixes RUSTSEC-2026-0205
# (scc 2.2->3.8 migration) — see captrack's own CHANGELOG.
captrack = { version = "=0.1.1", features = ["telemetry"] }
# Published on crates.io (https://crates.io/crates/bench-scale-tool, repo
# https://github.com/PHPCraftdream/bench-scale-tool). Was a non-reproducible
# `path = "D:/dev/rust/bench-scale-tool"` — broke every CI runner, which
# never has that absolute path (numa.yml, supply-chain.yml).
bench-scale-tool = { version = "0.1.0" }

[workspace.lints.clippy]
absolute_paths = "warn"
disallowed_methods = "warn"
disallowed_types = "deny"

[workspace.lints.rust]
# F-56 (#882): the loom model-checker module in `shamir-engine` compiles only
# under `RUSTFLAGS="--cfg loom"`. Register the cfg so `unexpected_cfgs` is
# satisfied (clippy `--all-targets -D warnings` runs without that flag) without
# needing a build script.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.dev]
opt-level = 0
codegen-units = 14
incremental = false
# `line-tables-only` keeps panic backtraces with file:line but drops the
# bulk of debug info (full `.pdb` per binary). With `--all-targets` +
# nextest building dozens of separate test binaries, full debuginfo was
# the dominant source of `target/` bloat; this roughly halves per-build
# size while leaving backtraces readable.
debug = "line-tables-only"

[profile.release]
lto = "fat"
# `opt-level = 3` (speed) instead of `"z"` (size). This is a server-
# side database — binary size barely matters, throughput on hot
# loops (filter eval, projection, codec) does. shamir-client-node
# has its own `[profile.release] opt-level = "z"` because it ships
# as a JS-bundled native module.
opt-level = 3
codegen-units = 14
incremental = false
debug = false
strip = true
# F-68 cluster C (#895): `panic = "abort"` (the scaffold default, never
# revisited) silently defeated EVERY panic-isolation boundary this server's
# architecture depends on. `shamir-server` is a long-lived multi-connection
# process where each connection's request loop spawns per-request dispatch
# tasks into its own `JoinSet` (`connection/request_loop.rs`) specifically so
# one connection's panic can't take down another's, and the background
# scheduler (`scheduler.rs::safe_run`) wraps each periodic GC/checkpoint tick
# in `std::panic::catch_unwind` for the same reason. Both mechanisms rely on
# stack unwinding to convert a panic into a `JoinError` / `Result::Err` that
# the surrounding code can react to (log-and-continue, tear down just the one
# connection). Under `panic = "abort"` there is no unwinding: the process
# calls `abort()` at the panic site, before `catch_unwind` or `JoinHandle`
# ever get a chance to run — a panic ANYWHERE (one connection's dispatch
# task, one background GC tick) kills the ENTIRE process and every other
# open connection with it, with no server-side log line pinpointing which
# task panicked (the whole process is gone). This reproduced as
# `e2e-permissions.test.ts`'s shared `adminClient` (or a concurrently-open
# sibling connection) seeing a clean-looking `Error: connection closed` at
# unpredictable, unrelated points in the file — exactly what "some panic
# aborts the whole process while N clients are mid-request" looks like from
# a client's point of view. `panic = "unwind"` restores the isolation this
# code already assumes and is written to rely on.
panic = "unwind"

# `cargo bench` uses this profile by default. Inherits from release
# but DROPS `lto = "fat"` — that single flag was 80%+ of the
# 7-minute bench compile time in dev iteration. Without it the
# bench binary compiles in ~1.5 minutes instead. The measurements
# come out 5-15% pessimistic vs. fat-LTO numbers because
# cross-crate inlining doesn't fire (planner/executor/storage
# stay in separate codegen units), but for iterative perf work
# the wall-clock saving wins.
#
# For "final" / publishable numbers run explicitly with the
# release profile:
#   cargo bench -p shamir-db --profile=release
[profile.bench]
inherits = "release"
lto = false
incremental = false
# Benches ALWAYS build at opt-level=1 — never 0, never 3. Two reasons:
#
# 1. Build speed: what hurts iterative /opti is the BUILD step, not the
#    measurement; with bench-scale-tool's fixed-iteration model the
#    reported ns/op is already a real per-op cost (no criterion adaptive
#    sampling to smooth over), so a leaner opt level keeps the
#    calibrate → run → re-calibrate loop fast. opt-1 is ~2.5× faster to
#    build than opt-3.
# 2. Correctness: opt-level=0 generates async fn state machines so large
#    (no variable-lifetime collapse across await points) that
#    deeply-chained bench setup (`fresh_db → seed_users → create_index` +
#    heavier query planner paths) overflows the ~1 MiB Windows main-thread
#    stack. opt-1 enables the lightest mir-opts that collapse those state
#    machines back under the limit. Documented in
#    docs/dev-artifacts/perf/sefer-alloc-rollout-2026-06-30.md under
#    "Stack overflow в engine_perf".
#
# For "final" / publishable absolute numbers, run explicitly with the
# release profile: cargo bench -p <crate> --bench <name> --profile=release
opt-level = 1
